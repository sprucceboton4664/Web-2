<!DOCTYPE html>
<html lang="es" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios - Cine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../service/horario-service.js" type="module"></script>
    <script src="../controllers/lista_horarios_controller.js" type="module"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .nav-link { transition: all 0.3s ease; }
        .nav-link:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn { transition: all 0.2s ease; }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .btn:active { transform: translateY(0); }
        .card { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .btn-edit { background-color: #3b82f6; color: white; }
        .btn-edit:hover { background-color: #2563eb; }
        .btn-delete { background-color: #ef4444; color: white; }
        .btn-delete:hover { background-color: #dc2626; }
        .btn-primary { background-color: #4f46e5; color: white; }
        .btn-primary:hover { background-color: #4338ca; }
    </style>
</head>
<body class="h-full">
    <div class="min-h-full">
        <nav class="bg-indigo-700">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <span class="text-white font-bold text-xl">CineMax</span>
                        </div>
                        <div class="hidden md:block">
                            <div class="ml-10 flex items-baseline space-x-4">
                                <a href="lista_peliculas.html" class="nav-link text-gray-300 hover:bg-indigo-600 hover:text-white px-3 py-2 rounded-md text-sm font-medium">
                                    <i class="fas fa-film mr-1"></i> Películas
                                </a>
                                <a href="lista_horarios.html" class="nav-link bg-indigo-800 text-white px-3 py-2 rounded-md text-sm font-medium">
                                    <i class="far fa-clock mr-1"></i> Horarios
                                </a>
                                <a href="lista_boletos.html" class="nav-link text-gray-300 hover:bg-indigo-600 hover:text-white px-3 py-2 rounded-md text-sm font-medium">
                                    <i class="fas fa-ticket-alt mr-1"></i> Boletos
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
        <header class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-900">Gestión de Horarios</h1>
                <button onclick="window.location.href='registrar_horario.html'" class="btn btn-primary px-4 py-2 rounded-md text-sm font-medium flex items-center">
                    <i class="fas fa-plus mr-2"></i> Nuevo Horario
                </button>
            </div>
        </header>
        <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            <div class="px-4 py-6 sm:px-0">
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Hora</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Sala</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Película</th>
                                    <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="horarios-list" class="bg-white divide-y divide-gray-200">
                                <tr id="loading-row">
                                    <td colspan="5" class="px-6 py-4 text-center text-gray-500">
                                        <div class="flex justify-center">
                                            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <template id="horario-template">
        <tr class="hover:bg-gray-50 transition-colors">
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 fecha"></td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 hora"></td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 sala"></td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-medium pelicula"></td>
            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-2">
                <button class="btn-edit px-3 py-1 rounded text-xs">
                    <i class="fas fa-edit mr-1"></i> Editar
                </button>
                <button class="btn-delete px-3 py-1 rounded text-xs">
                    <i class="fas fa-trash-alt mr-1"></i> Eliminar
                </button>
            </td>
        </tr>
    </template>
    <template id="empty-template">
        <tr>
            <td colspan="5" class="px-6 py-8 text-center">
                <div class="flex flex-col items-center justify-center text-gray-400">
                    <i class="far fa-calendar-alt text-4xl mb-2"></i>
                    <p class="text-sm">No hay horarios registrados</p>
                    <button onclick="window.location.href='registrar_horario.html'" class="mt-4 btn btn-primary px-4 py-2 rounded-md text-sm font-medium">
                        <i class="fas fa-plus mr-2"></i> Agregar horario
                    </button>
                </div>
            </td>
        </tr>
    </template>
</body>
</html>
