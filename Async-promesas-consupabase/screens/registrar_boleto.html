<!DOCTYPE html>
<html lang="es" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vender Boleto - CineMax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .nav-link { transition: all 0.3s ease; }
        .nav-link:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn { transition: all 0.2s ease; }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .btn:active { transform: translateY(0); }
        .card { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .btn-primary { background-color: #4f46e5; color: white; }
        .btn-primary:hover { background-color: #4338ca; }
        .btn-secondary { background-color: #6b7280; color: white; }
        .btn-secondary:hover { background-color: #4b5563; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #374151; }
        input[type="number"], select {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        input:read-only {
            background-color: #f3f4f6;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="h-full">
    <div class="min-h-full">
        <nav class="bg-indigo-700">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <span class="text-white font-bold text-xl">CineMax</span>
                        </div>
                        <div class="hidden md:block">
                            <div class="ml-10 flex items-baseline space-x-4">
                                <a href="lista_peliculas.html" class="nav-link text-gray-300 hover:bg-indigo-600 hover:text-white px-3 py-2 rounded-md text-sm font-medium">
                                    <i class="fas fa-film mr-1"></i> Películas
                                </a>
                                <a href="lista_horarios.html" class="nav-link text-gray-300 hover:bg-indigo-600 hover:text-white px-3 py-2 rounded-md text-sm font-medium">
                                    <i class="far fa-clock mr-1"></i> Horarios
                                </a>
                                <a href="lista_boletos.html" class="nav-link bg-indigo-800 text-white px-3 py-2 rounded-md text-sm font-medium">
                                    <i class="fas fa-ticket-alt mr-1"></i> Boletos
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <header class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8">
                <h1 class="text-2xl font-bold text-gray-900">Vender Boleto</h1>
            </div>
        </header>

        <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            <div class="bg-white shadow rounded-lg p-6">
                <form data-form class="max-w-md mx-auto">
                    <div class="form-group">
                        <label for="pelicula">Película</label>
                        <select id="pelicula" data-pelicula required class="w-full p-2 border rounded">
                            <option value="">Cargando películas...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="cantidad">Cantidad de Boletos</label>
                        <input type="number" id="cantidad" data-cantidad required min="1" max="10" value="1" class="w-full p-2 border rounded">
                    </div>

                    <div class="form-group">
                        <label for="precio">Precio Unitario</label>
                        <input type="number" id="precio" data-precio readonly class="w-full p-2 border rounded bg-gray-100">
                    </div>

                    <div class="form-group">
                        <label for="total">Precio Total</label>
                        <input type="number" id="total" data-total readonly class="w-full p-2 border rounded bg-gray-100">
                    </div>

                    <div class="mt-6 flex justify-end space-x-3">
                        <button type="button" onclick="window.location.href='lista_boletos.html'" class="btn-secondary px-4 py-2 rounded-md text-sm font-medium">
                            Cancelar
                        </button>
                        <button type="submit" class="btn-primary px-4 py-2 rounded-md text-sm font-medium">
                            <i class="fas fa-ticket-alt mr-2"></i> Vender Boleto
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script type="module" src="../controllers/registro_boleto_controller.js"></script>
</body>
</html>
